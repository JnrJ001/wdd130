<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ROGUE RAPIDS CO.</title>
    <meta name="description" content="Contact us for more information about our rafting trips and services. We are here to assist you with any inquiries or bookings.">
    <meta name="author" content="James Junior">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="Logo of White Water Rafting">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li> 
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h1>ROGUE RAPIDS CO.</h1>
            <h2>256 Main River Road</h2>
            <h2>New York, USA</h2>
            <h2>Phone: (123) 456-7890</h2>
            <h2>Email: info@rogue-rapids.com</h2>
        </div>
        <div class="contact-grid">
            <div>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d774386.7039254527!2d-73.97950600000001!3d40.697141499999994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c24fa5d33f083b%3A0xc80b8f06e177fe62!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sgh!4v1791017404049!5m2!1sen!2sgh" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>   
            <form>
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose:</legend>
                    <div>
                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>
                    </div>
                    <div>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>

                </fieldset>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>
                <div class="checkbox-row">
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter.
                    </label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="adventures contact-team">
            <h2>We Are Here to Serve You</h2>
             <div class="adventure-images contact-team-row">
                    <figure>
                        <img src="images/employee1.jpg" alt="Profile image of our receptionist, Jada Pinkett.">
                        <figcaption>JADA PINKETT, Receptionist</figcaption>
                    </figure> 
                    <figure>
                        <img src="images/employee2.jpg" alt="Profile image of our lead guide, Ernest Mike.">
                        <figcaption>ERNEST MIKE, Lead Guide</figcaption>
                    </figure>
                    <figure>
                    <img src="images/employee3.jpg" alt="Profile image of Jack Jones, our assistant guide.">
                    <figcaption>JACK JONES, Assistant Guide</figcaption>
                    </figure>
                </div>
    
        </section>
    </main>
    <footer>
     <p>
        &copy;2026 🚣‍♂️ ROGUE RAPIDS CO. 🚣‍♂️ | JAMES JUNIOR
     </p>
    <nav class="socialmedia">
         <a href="https://tiktok.com">
        <img src="images/tiktok-icon.svg" alt="TikTok Icon">
    </a>
    <a href="https://wa.me/">
        <img src="images/whatsapp-icon.svg" alt="WhatsApp Icon"></a>
    <a href="https://instagram.com">
        <img src="images/instagram-icon.svg" alt="Instagram Icon">
    </a>
    </nav> 
    </footer>
</body>
</html>
